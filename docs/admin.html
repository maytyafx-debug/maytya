<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Metatya | مدیریت</title>
<style>
:root{color-scheme:dark;--bg:#05060a;--card:#11151f;--line:#262d3d;--fg:#f3f5f9;--mut:#98a2b3;--ac:#34f5a6;--bad:#ff7a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.8 Vazirmatn,system-ui,sans-serif;padding:16px;max-width:860px;margin-inline:auto}
h1{font-size:1.3rem}h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
label{display:block;color:var(--mut);font-size:.85rem;margin:8px 0 4px}
input,select,textarea{width:100%;background:#0a0d16;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:46vh;direction:ltr;text-align:left;font:13px/1.6 ui-monospace,Menlo,monospace}
button{background:var(--ac);color:#03130c;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;margin:8px 8px 0 0}
button.g{background:#1b2232;color:var(--fg)}
#msg{min-height:1.6em;margin-top:8px}.ok{color:var(--ac)}.err{color:var(--bad)}
small{color:var(--mut)}
</style>
</head>
<body>
<h1>پنل مدیریت Metatya</h1>
<small>این صفحه عمومی است ولی بدون توکن شما هیچ کاری نمی‌کند. توکن فقط در همین مرورگر و فقط تا بستن تب می‌ماند.</small>

<div class="card" id="login">
  <h2>ورود</h2>
  <label>مخزن (کاربر/ریپو)</label><input id="repo" dir="ltr">
  <label>شاخه</label><input id="branch" dir="ltr" value="main">
  <label>توکن GitHub (Fine-grained، فقط همین ریپو، دسترسی Contents: Read and write)</label>
  <input id="token" type="password" dir="ltr" autocomplete="off">
  <button id="enter">ورود</button>
</div>

<div class="card" id="editor" hidden>
  <h2>ویرایش فایل</h2>
  <label>فایل</label>
  <select id="file">
    <option>topics.json</option><option>packs.json</option><option>monetization.json</option><option>testimonials.json</option>
  </select>
  <button class="g" id="load">بارگذاری</button>
  <textarea id="text" spellcheck="false"></textarea>
  <button id="save">ذخیره و انتشار</button>
  <button class="g" id="fmt">مرتب‌سازی JSON</button>
</div>

<div class="card" id="photo" hidden>
  <h2>عکس بنیان‌گذار</h2>
  <input id="img" type="file" accept="image/*">
  <button id="up">آپلود به‌عنوان founder.jpg</button>
  <br><small>عکس خودکار به ۴۸۰×۴۸۰ برش و فشرده می‌شود.</small>
</div>

<div id="msg"></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const m=(t,c)=>{$('msg').textContent=t;$('msg').className=c||''};
  const host=location.hostname.split('.')[0], seg=location.pathname.split('/')[1];
  $('repo').value=(host&&seg&&location.hostname.endsWith('github.io'))?host+'/'+seg:'';
  let sha=null,T='',R='',B='';
  const api=(p,o)=>fetch('https://api.github.com/repos/'+R+'/contents/'+p,Object.assign({headers:{Authorization:'Bearer '+T,Accept:'application/vnd.github+json'}},o||{}));
  const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
  const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
  try{T=sessionStorage.getItem('mt')||'';R=sessionStorage.getItem('mr')||''}catch(e){}
  if(T&&R){$('token').value=T;$('repo').value=R}

  $('enter').onclick=async()=>{
    T=$('token').value.trim();R=$('repo').value.trim();B=$('branch').value.trim()||'main';
    if(!T||!/^[\w.-]+\/[\w.-]+$/.test(R)){m('مخزن یا توکن درست نیست.','err');return}
    const r=await fetch('https://api.github.com/repos/'+R,{headers:{Authorization:'Bearer '+T}});
    if(!r.ok){m('ورود ناموفق ('+r.status+'). توکن و دسترسی را بررسی کن.','err');return}
    const j=await r.json();
    if(!(j.permissions&&j.permissions.push)){m('این توکن اجازه‌ی نوشتن ندارد.','err');return}
    try{sessionStorage.setItem('mt',T);sessionStorage.setItem('mr',R)}catch(e){}
    $('login').hidden=true;$('editor').hidden=false;$('photo').hidden=false;m('وارد شدی ✅','ok');load();
  };
  async function load(){
    m('در حال بارگذاری...');
    const r=await api('docs/'+$('file').value+'?ref='+B);
    if(!r.ok){m('بارگذاری نشد ('+r.status+')','err');return}
    const j=await r.json();sha=j.sha;$('text').value=unb64(j.content);m('بارگذاری شد.','ok');
  }
  $('load').onclick=load;
  $('fmt').onclick=()=>{try{$('text').value=JSON.stringify(JSON.parse($('text').value),null,2);m('مرتب شد.','ok')}catch(e){m('JSON نامعتبر: '+e.message,'err')}};
  $('save').onclick=async()=>{
    let t=$('text').value;
    try{JSON.parse(t)}catch(e){m('JSON نامعتبر است؛ ذخیره نشد: '+e.message,'err');return}
    if(!confirm('تغییر در سایت منتشر شود؟'))return;
    const f=$('file').value;
    const r=await api('docs/'+f,{method:'PUT',body:JSON.stringify({message:'admin: edit '+f,content:b64(t),sha:sha,branch:B})});
    if(r.ok){sha=(await r.json()).content.sha;m('ذخیره شد. سایت تا چند دقیقه‌ی دیگر به‌روز می‌شود ✅','ok')}
    else m('ذخیره نشد ('+r.status+'). اگر ۴۰۹ بود، دوباره «بارگذاری» بزن.','err');
  };
  $('up').onclick=async()=>{
    const file=$('img').files[0];if(!file){m('اول یک عکس انتخاب کن.','err');return}
    const im=new Image();im.src=URL.createObjectURL(file);
    await new Promise(r=>im.onload=r);
    const c=document.createElement('canvas');c.width=c.height=480;
    const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/3>0?(im.height-s)/3:0,s,s,0,0,480,480);
    const data=c.toDataURL('image/jpeg',.85).split(',')[1];
    let cur=await api('docs/founder.jpg?ref='+B),body={message:'admin: founder photo',content:data,branch:B};
    if(cur.ok)body.sha=(await cur.json()).sha;
    const r=await api('docs/founder.jpg',{method:'PUT',body:JSON.stringify(body)});
    m(r.ok?'عکس آپلود شد ✅ (چند دقیقه بعد در سایت دیده می‌شود)':'آپلود نشد ('+r.status+')',r.ok?'ok':'err');
  };
})();
</script>
</body>
</html>
