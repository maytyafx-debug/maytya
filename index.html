<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MayTya AI | Market Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  background:#0d0d0d;
  border-bottom:1px solid #2d2410;
}

.logo{
  color:#d6ad45;
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.subtitle{
  color:#888;
  margin-top:7px;
  font-size:12px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px 40px;
}

.hero{
  text-align:center;
  padding:25px 10px;
}

.hero h1{
  font-size:28px;
  margin-bottom:10px;
}

.hero span{
  color:#d6ad45;
}

.hero p{
  color:#999;
  font-size:13px;
  line-height:1.8;
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:20px;
}

.market-card{
  background:linear-gradient(145deg,#171717,#0c0c0c);
  border:1px solid #30260f;
  border-radius:18px;
  padding:20px 14px;
  min-height:170px;
}

.market-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  font-weight:bold;
}

.market-icon{
  font-size:27px;
}

.price{
  margin-top:18px;
  font-size:20px;
  font-weight:bold;
  color:#fff;
}

.loading{
  color:#777;
  font-size:14px;
}

.market-label{
  color:#777;
  font-size:11px;
  margin-top:7px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.action{
  background:#101010;
  border:1px solid #29210e;
  border-radius:15px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
}

.action:hover{
  border-color:#d6ad45;
}

.action-icon{
  font-size:25px;
  margin-bottom:7px;
}

.action-title{
  font-size:14px;
}

.status{
  margin-top:20px;
  background:#101010;
  border:1px solid #28200d;
  border-radius:14px;
  padding:14px;
  text-align:center;
  color:#888;
  font-size:12px;
}

.online{
  color:#55d68a;
  font-weight:bold;
}

footer{
  text-align:center;
  color:#555;
  font-size:10px;
  padding:25px;
  line-height:1.8;
}

@media(max-width:500px){
  .market-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MAYTYA AI</div>
  <div class="subtitle">SMART MARKET DASHBOARD</div>
</header>

<main class="container">

  <p>

  </p>

    </div>

    <div class="market-label">

    </div>
  </div>

      اتریوم
    </div>

    <div id="ethPrice" class="price loading">
      در حال دریافت...
    </div>

    <div class="market-label">
      ETH / USDT
    </div>
  </div>

      XAU / USD

    </div>
