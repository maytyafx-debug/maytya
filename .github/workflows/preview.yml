name: Metatya Safe Content Preview

on:
  workflow_dispatch:
    inputs:
      sections:
        description: "حوزه‌ها با کاما جدا شوند؛ مثال: forex,crypto"
        required: true
        default: "forex,crypto"
        type: string

permissions:
  contents: read

concurrency:
  group: metatya-content-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Generate and validate preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate safe preview
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREVIEW_SECTIONS: ${{ inputs.sections }}
        run: |
          python scripts/generate_preview.py

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatya-content-preview
          path: out/preview-content.json
          if-no-files-found: ignore
          retention-days: 7
