name: Metatya Safe Content Preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate.py"
      - "scripts/generate_preview.py"
      - "scripts/sections.py"
      - ".github/workflows/preview.yml"
  workflow_dispatch:
    inputs:
      sections:
        description: "حوزه‌ها با کاما جدا شوند؛ مثال: forex,crypto"
        required: true
        default: "forex,crypto"
        type: string

permissions:
  contents: read

concurrency:
  group: metatya-content-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Generate and validate preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate safe preview
        env:
          # اجرای خودکار روی push باید قطعی و بدون مصرف API باشد؛ اجرای دستی می‌تواند AI را آزمایش کند.
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
          PREVIEW_SECTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.sections || 'forex,crypto' }}
        run: python scripts/generate_preview.py

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metatya-content-preview
          path: out/preview-content.json
          if-no-files-found: ignore
          retention-days: 7
