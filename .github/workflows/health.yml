name: Metatya health check
on:
  schedule: [{cron: "30 */6 * * *"}]
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: سایت بالاست و محتوا تازه است؟
        env: {SITE_URL: "${{ vars.SITE_URL }}"}
        run: |
          [ -z "$SITE_URL" ] && echo "SITE_URL تنظیم نشده" && exit 1
          curl -fsS --max-time 30 "${SITE_URL%/}/" -o /dev/null
          curl -fsS --max-time 30 "${SITE_URL%/}/content.json" -o c.json
          python3 - <<'PY'
          import json,datetime
          d=json.load(open("c.json",encoding="utf-8"))
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d["updated"].replace("Z","+00:00"))
          bad=[k for k,v in d["sections"].items() if not v.get("ok",True)]
          print("سن محتوا (ساعت):",round(age.total_seconds()/3600,1),"| حوزه‌های خراب:",bad)
          assert age.total_seconds()<36*3600, "محتوا بیش از ۳۶ ساعت به‌روز نشده"
          PY
