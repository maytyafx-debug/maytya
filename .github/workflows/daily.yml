
name: Metatya daily

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metatya-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0

      - name: جمع‌آوری داده‌های روزانه
        run: python scripts/collector.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true

      - name: آماده‌سازی نسخه موقت محتوا
        run: |
          mkdir -p out
          test -s docs/content.json
          cp docs/content.json out/staged-content.json

      - name: تولید محتوای موقت
        run: python scripts/generate.py
        timeout-minutes: 20
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONTENT_OUTPUT: out/staged-content.json
          HISTORY_FILE: docs/content.json

      - name: اعتبارسنجی و انتشار اتمیک محتوا
        run: |
          python scripts/validate_content.py \
            --live docs/content.json \
            --staged out/staged-content.json \
            --promote

      - name: دانلود فونت وزیرمتن
        run: |
          mkdir -p assets/fonts
          curl -fsSL --max-time 60 \
            -o assets/fonts/Vazirmatn-Regular.ttf \
            "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf" \
            || echo "دانلود فونت نشد؛ فونت پیش‌فرض استفاده می‌شود"

          [ -s assets/fonts/Vazirmatn-Regular.ttf ] \
            && [ "$(head -c 4 assets/fonts/Vazirmatn-Regular.ttf | xxd -p)" = "00010000" ] \
            || rm -f assets/fonts/Vazirmatn-Regular.ttf
        continue-on-error: true

      - name: ساخت صفحات سایت
        run: python scripts/build_pages.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: ساخت ویدیو کوتاه
        run: python scripts/make_short.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: ارسال به تلگرام
        run: python scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          POST_MODE: ${{ vars.POST_MODE }}
          POST_KEYS: ${{ vars.POST_KEYS }}
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: جستجوگر فرصت
        run: python scripts/radar.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        continue-on-error: true

      - name: آپلود آرتیفکت‌ها
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            out/*.mp4
            out/*.png
            out/*.txt
          if-no-files-found: ignore

      - name: ثبت تغییرات
        run: |
          git config user.name "metatya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git commit -m "daily content $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push
