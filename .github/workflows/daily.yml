name: Metatya daily
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install ffmpeg and Persian font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-vazirmatn
          echo "=== Font paths ==="
          find /usr/share/fonts -iname "*vazir*" 2>/dev/null || echo "Not found via find"
          fc-list | grep -i vazir || echo "Not found via fc-list"
      - run: pip install -r requirements.txt
      - run: python scripts/generate.py
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          MISTRAL_API_KEY: "${{ secrets.MISTRAL_API_KEY }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - run: python scripts/build_pages.py
        env: {SITE_URL: "${{ vars.SITE_URL }}"}
      - run: python scripts/make_short.py
        env: {FONT_PATH: "/usr/share/fonts/truetype/vazirmatn/Vazirmatn-Regular.ttf"}
        continue-on-error: true
      - run: python scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          SITE_URL: "${{ vars.SITE_URL }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: {name: shorts, path: "out/*.mp4\nout/*.txt", if-no-files-found: ignore}
      - name: commit content (backup)
        run: |
          git config user.name "metatya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs && git commit -m "daily content $(date -u +%F)" || echo "no changes"
          git push
