
name: Metatya daily

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate.py"
      - "scripts/sections.py"
      - "scripts/validate_content.py"
      - "scripts/build_products.py"
      - "scripts/upload_private_products.py"
      - "scripts/build_pages.py"
      - "scripts/make_short.py"
      - "scripts/post_telegram.py"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "30 4 * * *" # ساعت ۸ صبح تهران
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metatya-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: آماده‌سازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libfribidi0

      - name: جمع‌آوری داده‌های روزانه
        run: python scripts/collector.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true

      - name: ساخت فایل موقت از محتوای زنده
        run: |
          mkdir -p out
          test -s docs/content.json
          cp docs/content.json out/staged.json

      - name: تولید محتوای جدید
        run: python scripts/generate.py
        timeout-minutes: 20
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONTENT_OUTPUT: ${{ github.workspace }}/out/staged.json
          HISTORY_FILE: ${{ github.workspace }}/docs/content.json

      - name: اعتبارسنجی و انتشار جزئی با حفظ تاریخچه
        run: |
          python scripts/validate_content.py \
            --live docs/content.json \
            --staged out/staged.json \
            --promote

      - name: دانلود فونت وزیرمتن
        run: |
          mkdir -p assets/fonts
          curl -fsSL --max-time 60 \
            -o assets/fonts/Vazirmatn-Regular.ttf \
            "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf" \
            || echo "دانلود فونت انجام نشد"

          if [ -s assets/fonts/Vazirmatn-Regular.ttf ]; then
            if [ "$(head -c 4 assets/fonts/Vazirmatn-Regular.ttf | xxd -p)" != "00010000" ]; then
              rm -f assets/fonts/Vazirmatn-Regular.ttf
            fi
          fi
        continue-on-error: true

      - name: ساخت فایل‌های واقعی محصولات LITE و PRO
        run: python scripts/build_products.py

      - name: بارگذاری امن فایل‌های PRO در فضای خصوصی Supabase
        run: python scripts/upload_private_products.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: ساخت صفحات سایت
        run: python scripts/build_pages.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: ساخت ویدیوی کوتاه آموزشی
        run: python scripts/make_short.py
        timeout-minutes: 4
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: ارسال محتوای تلگرام
        run: python scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@Maytyafx"
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          POST_MODE: auto
          POST_KEYS: ${{ vars.POST_KEYS }}
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: ربات جستجوگر فرصت
        run: python scripts/radar.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        continue-on-error: true

      - name: ذخیره آرتیفکت‌ها
        uses: actions/upload-artifact@v4
        with:
          name: metatya-daily-output
          path: |
            out/*.mp4
            out/*.png
            out/*.txt
            out/staged.json
          if-no-files-found: ignore

      - name: بررسی تغییرات و ثبت نسخه
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "metatya-bot"
          git config user.email "bot@users.noreply.github.com"

          git add docs data -- ':!*.bak'

          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "هیچ تغییر جدیدی برای ثبت وجود ندارد."
            exit 0
          fi

          echo "NO_CHANGES=false" >> "$GITHUB_ENV"

          git commit -m "daily content $(date -u +%F)"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
