name: Metatya daily

on:
  schedule:
    - cron: "30 4 * * *"   # هر روز ساعت ۸:۰۰ صبح به وقت تهران (UTC+3:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metatya-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt && sudo apt-get update && sudo apt-get install -y ffmpeg libraqm0 libfribidi0

      - name: دانلود فونت وزیرمتن (قبل از ساخت PDF)
        run: |
          mkdir -p assets/fonts
          curl -fsSL --max-time 60 -o assets/fonts/Vazirmatn-Regular.ttf "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf" || echo "دانلود فونت نشد"
        continue-on-error: true

      - name: ربات‌های جمع‌آوری داده
        run: python scripts/collector.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        continue-on-error: true

      - name: تولید محتوا
        run: python scripts/generate.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: ساخت صفحات سایت
        run: python scripts/build_pages.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: ساخت و آپلود پکیج‌های اختصاصی VIP (Supabase)
        run: python scripts/make_packages.py
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FONT_PATH: "assets/fonts/Vazirmatn-Regular.ttf"

      - name: ساخت ویدیو کوتاه
        run: python scripts/make_short.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: ارسال به تلگرام (کانال عمومی)
        run: python scripts/post_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          POST_MODE: ${{ vars.POST_MODE }}
          POST_KEYS: ${{ vars.POST_KEYS }}
          SITE_URL: ${{ vars.SITE_URL }}
        continue-on-error: true

      - name: ربات جستجوگر فرصت
        run: python scripts/radar.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        continue-on-error: true

      - name: آپلود آرتیفکت‌ها
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            out/*.mp4
            out/*.png
            out/*.txt
          if-no-files-found: ignore

      - name: commit content (backup)
        run: |
          git config user.name "metatya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data && git commit -m "daily content $(date -u +%F)" || echo "no changes"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push
