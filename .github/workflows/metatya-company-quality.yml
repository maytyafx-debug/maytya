name: METATYA Corporate Site Quality

on:
  push:
    branches:
      - feat/metatya-corporate-home
    paths:
      - "docs/metatya.html"
      - "docs/company-*.html"
      - "docs/metatya-company.css"
      - "docs/metatya-company.js"
      - "docs/design-system/metatya-corporate-page-template.html"
      - "docs/design-system/metatya-corporate-design-system.md"
      - "docs/index.html"
      - "scripts/test-metatya-company.mjs"
      - ".github/workflows/metatya-company-quality.yml"
  pull_request:
    paths:
      - "docs/metatya.html"
      - "docs/company-*.html"
      - "docs/metatya-company.css"
      - "docs/metatya-company.js"
      - "docs/design-system/metatya-corporate-page-template.html"
      - "docs/design-system/metatya-corporate-design-system.md"
      - "docs/index.html"
      - "scripts/test-metatya-company.mjs"
      - ".github/workflows/metatya-company-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatya-company-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-metatya-company.mjs
