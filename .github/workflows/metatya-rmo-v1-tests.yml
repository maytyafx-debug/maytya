name: METATYA RMO V1 — Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/metatya_rmo_v1/**"
      - ".github/workflows/metatya-rmo-v1-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RMO and Knowledge Bridge tests (no network calls)
        run: python -m unittest discover -s scripts/metatya_rmo_v1 -p 'test_*.py' -v
