name: Deploy sales bots (Cloudflare Worker, free)
on:
  workflow_dispatch: {}
  push: {paths: ["worker/**", "docs/packs.json"]}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: ساخت فایل Secret ها (فقط مواردی که مقدار دارند)
        env:
          BOT_RISK: ${{ secrets.BOT_RISK }}
          BOT_BOURSE: ${{ secrets.BOT_BOURSE }}
          BOT_FIT: ${{ secrets.BOT_FIT }}
          BOT_MIND: ${{ secrets.BOT_MIND }}
          BOT_BIZ: ${{ secrets.BOT_BIZ }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          PAY_INFO: ${{ secrets.PAY_INFO }}
        run: |
          python3 - <<'PY'
          import os, json
          keys = ["BOT_RISK","BOT_BOURSE","BOT_FIT","BOT_MIND","BOT_BIZ","WEBHOOK_SECRET","OWNER_CHAT_ID","PAY_INFO"]
          d = {k: os.environ[k] for k in keys if os.environ.get(k)}
          json.dump(d, open("secrets.json","w"), ensure_ascii=False)
          print("secrets:", sorted(d), "| تعداد:", len(d))
          PY
      - name: بررسی توکن Cloudflare
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret با نام CLOUDFLARE_DEPLOY_TOKEN خالی یا نامعتبر است"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret با نام CLOUDFLARE_ACCOUNT_ID خالی است"; exit 1; }
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /dev/null \
            || { echo "::error::توکن CLOUDFLARE_DEPLOY_TOKEN معتبر نیست"; exit 1; }
          echo "توکن معتبر است"
      - name: دیپلوی Worker
        id: deploy
        run: |
          set -euo pipefail
          cd worker
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::آدرس Worker در خروجی deploy پیدا نشد"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL"
      - name: ارسال Secret ها به Worker
        run: |
          set -euo pipefail
          cd worker && npx --yes wrangler@4 secret bulk ../secrets.json
      - name: ثبت webhook ها در تلگرام
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BOT_RISK: ${{ secrets.BOT_RISK }}
          BOT_BOURSE: ${{ secrets.BOT_BOURSE }}
          BOT_FIT: ${{ secrets.BOT_FIT }}
          BOT_MIND: ${{ secrets.BOT_MIND }}
          BOT_BIZ: ${{ secrets.BOT_BIZ }}
        run: pip install requests -q && python scripts/set_webhooks.py
