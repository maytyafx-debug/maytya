name: METATYA Model Benchmark V1 — Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/model_benchmark_v1/**"
      - ".github/workflows/model-benchmark-v1-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Run benchmark unit tests (no API calls)
        run: python -m unittest discover -s scripts/model_benchmark_v1 -p 'test_*.py' -v
